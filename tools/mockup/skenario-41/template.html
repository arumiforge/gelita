<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Skenario Digital</title>
<style>
@font-face { font-family: 'Marcellus'; src: url({{font_marcellus}}) format('woff2'); }
@font-face { font-family: 'Jakarta'; font-weight: 400; src: url({{font_jakarta}}) format('woff2'); }
@font-face { font-family: 'Jakarta'; font-weight: 600; src: url({{font_jakarta6}}) format('woff2'); }
@font-face { font-family: 'Jakarta'; font-weight: 700; src: url({{font_jakarta7}}) format('woff2'); }
:root {
  --gold: #DFC087; --gold-hi: #F0DFB8; --gold-deep: #B8893F; --cream: #FFF4D6; --ink: #2A1A08;
  --navy: #0B1320; --navy-2: #1B2740; --muted: #C9C2B0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05080F; color: var(--cream); font-family: 'Jakarta', system-ui, sans-serif; }
body { display: flex; flex-direction: column; }

/* Review toolbar: outside the game stage */
.tools { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 16px; background: #10151F; border-bottom: 1px solid #2A3245; font-size: 14px; }
.tools b { color: var(--gold); font-weight: 600; }
.tools .grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tools button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid #3A4560; background: #182035; color: var(--cream); cursor: pointer; }
.tools button[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.tools label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.viewport { flex: 1; display: grid; place-items: center; overflow: hidden; min-height: 0; }

/* Stage 1280 x 720 dp, scaled to fit */
.stage { width: 1280px; height: 720px; position: relative; overflow: hidden; transform-origin: center; flex: none;
  background: var(--bg) center / cover no-repeat; }
.stage::before { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(5, 9, 18, .05), rgba(5, 9, 18, .45) 22%, rgba(5, 9, 18, .72)); }
/* Darker band behind the header so the HUD reads on any background (owner, 19 Nov 2026) */
.abs { position: absolute; }

/* Header, one row (decision 13) */
.head { left: 32px; top: 16px; width: 1216px; height: 72px; display: flex; align-items: center; gap: 18px; }
.head .logo { height: 52px; width: auto; }
.head .sep { width: 1px; height: 44px; background: linear-gradient(transparent, var(--gold-deep), transparent); }
.badge { position: relative; width: 60px; height: 60px; flex: none; }
.badge img { width: 100%; height: 100%; }
.badge span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 26px 'Jakarta'; color: var(--ink); }
.titles h1 { margin: 0; font: 700 27px/1 'Jakarta'; color: #FFFFFF; letter-spacing: .01em; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.titleplate { position: relative; display: flex; align-items: center; height: 60px; }
.titleplate::before { content: ''; position: absolute; left: 30px; right: 0; top: 7px; bottom: 7px; border-radius: 0 23px 23px 0; background: rgba(11, 19, 32, .85); border: 1px solid rgba(223, 192, 135, .55); border-left: 0; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); }
.titleplate .badge { z-index: 1; }
.titleplate .titles { position: relative; padding: 0 24px 0 14px; }
.titles { display: flex; align-items: center; gap: 12px; }
.titles .city { font: 600 17px/22px 'Jakarta'; color: var(--muted); padding-left: 12px; border-left: 1px solid rgba(223, 192, 135, .5); }
.head .end { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.capsule { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px 0 6px; border-radius: 24px; background: rgba(11, 19, 32, .82); border: 1px solid rgba(223, 192, 135, .55); font: 700 20px 'Jakarta'; }
.capsule img { width: 36px; height: 36px; }
.capsule .div { width: 1px; height: 26px; background: rgba(223, 192, 135, .5); margin: 0 4px; }
.round { width: 48px; height: 48px; padding: 0; border: 0; background: none; cursor: pointer; }
.round img { width: 100%; height: 100%; }
.exit { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0; color: var(--cream); font: 600 17px 'Jakarta'; }
.exit img { width: 48px; height: 48px; }

/* Panels: no frame, no extra background (decision 1) */
.left { left: 32px; top: 104px; width: 600px; height: 584px; display: flex; flex-direction: column; padding: 0; }
.right { left: 664px; top: 104px; width: 584px; height: 584px; display: flex; flex-direction: column; padding: 6px 0 0; }
.divline { left: 648px; top: 120px; width: 1px; height: 552px; background: linear-gradient(transparent, rgba(223, 192, 135, .35), transparent); }

.story-head { display: flex; align-items: center; gap: 14px; height: 40px; flex: none; font: 600 18px 'Jakarta'; }
.bars { display: flex; gap: 6px; }
.bars i { width: 34px; height: 8px; border-radius: 4px; background: rgba(223, 192, 135, .22); border: 1px solid rgba(223, 192, 135, .45); }
.bars i.is-closed { background: var(--gold-deep); }
.bars i.is-current { background: var(--gold); box-shadow: 0 0 8px rgba(240, 223, 184, .6); }
.tries { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--cream); font-weight: 400; }
.tries i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--gold-deep); }
.tries i.is-left { background: radial-gradient(circle at 35% 35%, var(--gold-hi), var(--gold-deep)); border-color: var(--gold); box-shadow: 0 0 6px rgba(240, 223, 184, .5); }
.media { position: relative; margin: 6px auto 0; width: var(--pic-w); flex: none; border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, .5); }
.picture { display: block; width: 100%; height: auto; border-radius: 10px; }
.media .player { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: 252px; margin: 0; padding-right: 22px; background: rgba(11, 19, 32, .9); }
.media .player.is-playing { left: 12px; right: 12px; transform: none; width: auto; }
.player { margin: 14px 0 0; display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 18px 0 6px; border-radius: 26px; background: rgba(11, 19, 32, .78); border: 1px solid rgba(223, 192, 135, .45); }
.player .round { width: 42px; height: 42px; }
.player .lbl { font: 600 20px 'Jakarta'; white-space: nowrap; }
.wave { flex: 1; display: flex; align-items: center; justify-content: center; gap: 3px; height: 30px; }
.wave i { width: 3px; border-radius: 2px; background: var(--gold); height: var(--h); opacity: .75; }
.player.is-playing .wave i { animation: wave 1s ease-in-out infinite; animation-delay: var(--d); opacity: 1; }
@keyframes wave { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
.player .dur { font: 600 15px 'Jakarta'; color: var(--muted); font-variant-numeric: tabular-nums; }
.situation { margin: 12px 0 0; padding: 0 14px; font-size: var(--sit-fs, 20px); line-height: 1.45; }

/* Right panel */
.toggle { align-self: center; display: flex; gap: 10px; }
.toggle span { position: relative; display: flex; align-items: center; gap: 8px; width: 144px; height: 40px; padding: 0 18px 0 0; border-radius: 20px; font: 600 17px 'Jakarta'; color: var(--muted); background: rgba(11, 19, 32, .7); border: 1px solid rgba(223, 192, 135, .4); }
.toggle span i { position: relative; width: 44px; height: 44px; margin: -2px 0 -2px -4px; display: grid; place-items: center; font: 700 19px 'Jakarta'; font-style: normal; color: var(--ink); background: url({{badge}}) center / 100% 100% no-repeat; filter: grayscale(.5) brightness(.75); }
.toggle span.is-on { color: var(--ink); background: linear-gradient(#FBEBC0, #E3C07C); border-color: #B8893F; }
.toggle span.is-on i { filter: none; }
.question { margin: 12px 0 0; text-align: left; font: 600 20px/1.35 'Jakarta'; color: var(--gold-hi); }
.question.is-small { font-size: 20px; }
.hint { margin: 12px 0 0; padding: 0 4px 12px; border-bottom: 1px solid rgba(223, 192, 135, .3); }
.hint .player { height: 36px; gap: 10px; padding: 0; border: 0; background: none; border-radius: 0; }
.hint .player .round { width: 32px; height: 32px; }
.hint .player .lbl { font: 600 20px 'Jakarta'; color: var(--gold); }
.hint .player .wave { flex: 0 1 220px; height: 24px; }
.instr { margin: 6px 0 0; font-size: 20px; line-height: 1.4; color: var(--cream); text-align: left; }
.chosen { margin: 12px 0 0; display: flex; align-items: flex-start; gap: 10px; padding: 0 4px 12px; border-bottom: 1px solid rgba(223, 192, 135, .3); font-size: 20px; line-height: 1.4; }
.chosen .mk { flex: none; color: var(--gold); font-size: 20px; line-height: 28px; }
.chosen b { color: var(--gold); font-weight: 600; }
.options { margin: 14px 0 0; display: flex; flex-direction: column; gap: var(--gap, 10px); }
.opt { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 8px 18px; border-radius: 12px; cursor: pointer;
  background: none; border: 1.5px solid transparent; font-size: 20px; line-height: 1.3; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
.opt input { position: absolute; opacity: 0; }
.opt .mark { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--gold); display: grid; place-items: center; }
.opt.is-on { border-color: var(--gold-hi); background: rgba(20, 46, 58, .92); box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(240, 223, 184, .45); }
.opt.is-on .mark::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 6px var(--gold-hi); }
.feedback { margin: 18px 0 0; padding: 16px 20px; border-radius: 12px; background: rgba(11, 19, 32, .86); border: 1.5px solid rgba(223, 192, 135, .5); font-size: 19px; line-height: 1.45; }
.feedback.is-safe { border-color: var(--gold-hi); box-shadow: 0 0 14px rgba(240, 223, 184, .3); }
.note { margin: 12px 0 0; font-size: 17px; color: var(--muted); text-align: center; }
.safe { margin: 10px 0 0; padding: 12px 18px; border-radius: 12px; background: rgba(20, 46, 58, .92); border: 1.5px solid var(--gold-hi); font: 600 19px/1.35 'Jakarta'; }
.expl { margin: 12px 0 0; font-size: 18px; line-height: 1.45; }
.actions { margin-top: auto; display: flex; justify-content: center; gap: 16px; padding: 12px 0 4px; }
.btn { position: relative; height: 58px; display: inline-flex; align-items: center; cursor: pointer; border: 0; background: none; font: 700 21px 'Jakarta'; white-space: nowrap; }
.btn img { position: absolute; top: -3px; width: 64px; height: 64px; }
/* Forward (owner, 19 Nov 2026, seventh notes): the plate-next picture, disc with the right arrow at the right end;
   stand-in sliced at its ends so a longer label fits until the new pictures are drawn at their sizes */
.btn.gold { width: 284px; justify-content: center; line-height: 1; padding: 0 18px 3px 16px; color: var(--cream); border-style: solid; border-width: 7.97px 60.18px 9.79px 28.28px; border-image: url({{plate_next}}) 22 166 27 78 fill / 7.97px 60.18px 9.79px 28.28px / 0 stretch; }
.btn.gold.long { width: 392px; }
/* Back: the existing plate-back picture (disc at the left end), text without an arrow */
.btn.back { width: 248px; justify-content: center; line-height: 1; padding: 0 18px 3px 16px; color: var(--cream); border-style: solid; border-width: 9.43px 19.21px 10.15px 60.9px; border-image: url({{plate_back}}) 26 53 28 168 fill / 9.43px 19.21px 10.15px 60.9px / 0 stretch; }
.btn:disabled { filter: grayscale(.6) brightness(.7); cursor: default; }
.over { outline: 2px dashed #FF5C8A; outline-offset: -2px; }
.overflow-flag { position: absolute; right: 8px; bottom: 6px; font-size: 12px; color: #FF8FB0; }
</style>
</head>
<body>
<div class="tools">
  <span class="grp"><b>Cerita</b>
    <button type="button" data-scen="tmg-5-b01" aria-pressed="true">Biasa (Temanggung, 3 pilihan)</button>
    <button type="button" data-scen="wnb-5-a04" aria-pressed="false">Terpanjang (Wonosobo, 4 tindakan, 5 alasan)</button>
  </span>
  <span class="grp"><b>Keadaan</b>
    <button type="button" data-go="action">1 Tindakan</button>
    <button type="button" data-go="reason">2 Alasan</button>
    <button type="button" data-go="feedback">Umpan balik</button>
    <button type="button" data-go="explained">Tindakan aman</button>
  </span>
  <label><input type="checkbox" id="opt-research"> Mode penelitian (tanpa jam)</label>
  <label><input type="checkbox" id="opt-novoice"> Tanpa narasi</label>
</div>
<div class="viewport" id="viewport"><div class="stage" id="stage"></div></div>
<script>
const IMG = /*IMG*/{};
const SCEN = /*SCEN*/{};
const PIC_W = Number(new URLSearchParams(location.search).get('pic') || 504);
const REGION = { temanggung: 'Temanggung', wonosobo: 'Wonosobo' };
const state = { key: 'tmg-5-b01', step: 'action', action: null, reason: null, tries: 3, closed: 0, result: null, playing: null };
const stage = document.getElementById('stage');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const wave = Array.from({ length: 34 }, (_, i) => `<i style="--h:${8 + Math.round(20 * Math.abs(Math.sin(i * 1.7)))}px;--d:${(i % 7) * -.13}s"></i>`).join('');

function fit() {
  const v = document.getElementById('viewport');
  const s = Math.min(v.clientWidth / 1280, v.clientHeight / 720);
  stage.style.transform = `scale(${s})`;
}

function player(which, label, dur, onlyWhilePlaying = false) {
  const on = state.playing === which;
  const extra = dur && (on || !onlyWhilePlaying) ? `<span class="wave">${wave}</span><span class="dur">${dur}</span>` : '';
  return `<div class="player${on ? ' is-playing' : ''}"><button class="round" type="button" data-act="play" data-which="${which}"><img src="${on ? IMG.pause : IMG.play}" alt=""></button><span class="lbl">${on ? 'Sedang dibacakan…' : label}</span>${extra}</div>`;
}
function render() {
  const sc = SCEN[state.key];
  const research = document.getElementById('opt-research').checked;
  const voiced = !document.getElementById('opt-novoice').checked;
  const long = sc.situation.length > 200;
  stage.style.setProperty('--bg', `url(${IMG['bg_' + sc.region]})`);
  const opts = state.step === 'reason' ? sc.reasons : sc.actions.map((a) => a.text);
  const chosen = state.step === 'reason' ? state.reason : state.action;
  const optionsHtml = opts.map((t, i) => `<label class="opt${chosen === i ? ' is-on' : ''}"><input type="radio" name="o" value="${i}"${chosen === i ? ' checked' : ''}><span class="mark"></span><span>${esc(t)}</span></label>`).join('');
  const bars = Array.from({ length: 4 }, (_, i) => `<i class="${i < state.closed ? 'is-closed' : i === state.closed ? 'is-current' : ''}"></i>`).join('');
  const dots = Array.from({ length: 3 }, (_, i) => `<i class="${i < state.tries ? 'is-left' : ''}"></i>`).join('');

  let right = '';
  if (state.step === 'action' || state.step === 'reason') {
    const isAction = state.step === 'action';
    right = `
      <div class="toggle" aria-hidden="true"><span class="${isAction ? 'is-on' : ''}"><i>1</i>Tindakan</span><span class="${isAction ? '' : 'is-on'}"><i>2</i>Alasan</span></div>
      ${isAction ? `<div class="hint">${voiced ? player('instr', 'Dengarkan petunjuk', '0:06', true) : ''}<p class="instr">Bacalah ceritanya. Pilih apa yang akan kamu lakukan, lalu pilih alasanmu.</p></div>
        <h2 class="question">Apa yang akan kamu lakukan?</h2>`
      : `<p class="chosen"><span class="mk" aria-hidden="true">↳</span><span><b>Pilihanmu</b> · ${esc(sc.actions[state.action ?? 0].text)}</span></p>
        <h2 class="question is-small">Yang paling penting kupikirkan di sini adalah …</h2>`}
      <div class="options" role="radiogroup">${optionsHtml}</div>
      <div class="actions">
        ${isAction ? '' : '<button class="btn back" type="button" data-act="back">Kembali</button>'}
        <button class="btn gold" type="button" data-act="${isAction ? 'toReason' : 'send'}"${chosen === null ? ' disabled' : ''}>${isAction ? 'Lanjut ke alasan' : 'Kirim jawaban'}</button>
      </div>`;
  } else if (state.step === 'feedback') {
    const a = sc.actions[state.action ?? 0];
    const safe = a.score === 2;
    right = `
      <h2 class="question">${safe ? 'Pilihan yang aman!' : 'Ayo pikirkan lagi'}</h2><!-- heading: new text, proposal -->
      <p class="feedback${safe ? ' is-safe' : ''}">${esc(a.feedback)}</p>
      ${safe ? '' : `<p class="note">Kamu masih punya ${state.tries} kesempatan. Pilih lagi tindakan dan alasanmu.</p>`}
      <div class="actions"><button class="btn gold${safe ? ' long' : ''}" type="button" data-act="${safe ? 'next' : 'retry'}">${safe ? 'Lanjut ke cerita berikutnya' : 'Coba lagi'}</button></div>`;
  } else {
    const safe = sc.actions.find((a) => a.score === 2);
    right = `
      <p class="note" style="margin-top:4px">Kesempatanmu untuk cerita ini sudah habis. Ayo lanjut ke cerita berikutnya.</p>
      <h2 class="question">Ini tindakan yang aman</h2>
      <p class="safe">${esc(safe.text)}</p>
      <p class="expl">${esc(sc.explanation)}</p>
      <div class="actions"><button class="btn gold long" type="button" data-act="next">Lanjut ke cerita berikutnya</button></div>`;
  }

  stage.innerHTML = `
    <header class="abs head">
      <div class="titleplate"><span class="badge"><img src="${IMG.badge}" alt=""><span>5</span></span>
      <div class="titles"><h1>Skenario Digital</h1><span class="city">${REGION[sc.region]}</span></div></div>
      <div class="end">
        <span class="capsule">${research ? '' : `<img src="${IMG.clock}" alt=""> 4:47 <span class="div"></span>`}<img src="${IMG.right}" alt=""> ${state.closed}</span>
        <button class="round" type="button" title="Suara"><img src="${IMG.sound}" alt=""></button>
        <button class="round" type="button" title="Keluar"><img src="${IMG.logout}" alt="Keluar"></button>
      </div>
    </header>
    <section class="abs left" style="--sit-fs:${long ? 19 : 20}px;--pic-w:${PIC_W}px">
      <div class="story-head">Cerita ${state.closed + 1} dari 4 <span class="bars">${bars}</span><span class="tries">Kesempatan ${dots}</span></div>
      <div class="media"><img class="picture" src="${IMG['pic_' + state.key]}" alt="">${voiced ? player('story', 'Dengarkan cerita', '0:18', true) : ''}</div>
      <p class="situation">${esc(sc.situation)}</p>
    </section>
    <section class="abs right" style="--gap:${opts.length > 3 ? 8 : 10}px">${right}</section>`;
  // Mark a panel whose content does not fit (a design check, not part of the game)
  for (const panel of stage.querySelectorAll('.left, .right')) {
    const over = panel.scrollHeight > panel.clientHeight + 1;
    panel.classList.toggle('over', over);
    if (over) panel.insertAdjacentHTML('beforeend', '<span class="overflow-flag">tidak muat</span>');
  }
}

stage.addEventListener('change', (e) => {
  if (!e.target.matches('input[type=radio]')) return;
  state[state.step] = Number(e.target.value);
  state.playing = null;
  render();
});
stage.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  const sc = SCEN[state.key];
  if (act === 'play') { const w = e.target.closest('[data-which]').dataset.which; state.playing = state.playing === w ? null : w; }
  if (act === 'toReason') { state.step = 'reason'; state.playing = null; }
  if (act === 'back') state.step = 'action';
  if (act === 'send') {
    state.tries -= 1;
    const safe = sc.actions[state.action].score === 2;
    if (safe) { state.step = 'feedback'; } else if (state.tries === 0) { state.step = 'explained'; } else { state.step = 'feedback'; }
  }
  if (act === 'retry') { state.step = 'action'; state.action = null; state.reason = null; }
  if (act === 'next') { state.closed = Math.min(3, state.closed + 1); state.step = 'action'; state.action = null; state.reason = null; state.tries = 3; }
  render();
});
document.querySelectorAll('[data-scen]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-scen]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  Object.assign(state, { key: b.dataset.scen, step: 'action', action: null, reason: null, tries: 3, playing: null });
  render();
}));
document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => {
  const sc = SCEN[state.key];
  const go = b.dataset.go;
  state.step = go;
  if (go === 'reason') { state.action ??= 0; state.reason = null; }
  if (go === 'feedback') { state.action = sc.actions.findIndex((a) => a.score === 0); state.tries = 2; }
  if (go === 'explained') { state.tries = 0; }
  render();
}));
document.getElementById('opt-research').addEventListener('change', render);
document.getElementById('opt-novoice').addEventListener('change', render);
addEventListener('resize', fit);
render();
fit();
</script>
</body>
</html>
