<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-label="Sistem menyimpan data mentah dan turunan; analisis statistik dikerjakan di luar" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="760" height="384" fill="#fff"/><defs><marker id="layer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#525252"/></marker></defs><text x="24" y="36" font-size="15" font-weight="600" fill="#0a0a0a" text-anchor="start">Sistem menyimpan data mentah dan turunan; analisis statistik dikerjakan di luar</text><rect x="24" y="64" width="368" height="296" rx="12" fill="#f7f7f7" stroke="#e5e5e5"/><text x="40" y="88" font-size="13" font-weight="600" fill="#525252" text-anchor="start">Di sistem GELITA</text><rect x="424" y="64" width="312" height="296" rx="12" fill="#fff" stroke="#e5e5e5"/><text x="440" y="88" font-size="13" font-weight="600" fill="#525252" text-anchor="start">Di luar sistem (peneliti)</text><rect x="40" y="112" width="160" height="88" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25"/><text x="56" y="136" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">1. Data mentah</text><text x="56" y="156" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">ketukan, jawaban,</text><text x="56" y="172" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">percobaan, event;</text><text x="56" y="188" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">hanya ditambah</text><rect x="216" y="112" width="160" height="88" rx="10" fill="#efefef" stroke="#0a0a0a" stroke-width="2"/><text x="232" y="136" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">2. Data turunan</text><text x="232" y="156" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">kode kesalahan,</text><text x="232" y="172" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">waktu aktif,</text><text x="232" y="188" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">dilewati, tersensor</text><rect x="40" y="264" width="336" height="72" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25" stroke-dasharray="5 4"/><text x="56" y="288" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">Panel pemantauan lapangan</text><text x="56" y="308" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">siapa belum selesai, sesi aktif, event hilang</text><text x="56" y="324" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">(operasional, bukan hasil penelitian)</text><rect x="440" y="112" width="140" height="88" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25"/><text x="456" y="136" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">3. Analisis</text><text x="456" y="156" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Rasch, model</text><text x="456" y="172" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">campuran, κ;</text><text x="456" y="188" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">skrip tersimpan</text><rect x="596" y="112" width="124" height="88" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25"/><text x="612" y="136" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">Hasil</text><text x="612" y="156" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">naskah jurnal</text><text x="612" y="172" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">dan laporan</text><rect x="440" y="264" width="140" height="72" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25"/><text x="456" y="288" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">Lembar L0–L8</text><text x="456" y="308" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">diketik ke templat</text><text x="456" y="324" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">atau situs statis</text><path d="M200 156H214" fill="none" stroke="#525252" stroke-width="1.25" marker-end="url(#layer-arrow)"/><path d="M376 156H438" fill="none" stroke="#525252" stroke-width="1.25" marker-end="url(#layer-arrow)"/><path d="M580 156H594" fill="none" stroke="#525252" stroke-width="1.25" marker-end="url(#layer-arrow)"/><path d="M120 200V262" fill="none" stroke="#525252" stroke-width="1.25" marker-end="url(#layer-arrow)"/><path d="M510 264V202" fill="none" stroke="#525252" stroke-width="1.25" marker-end="url(#layer-arrow)"/><text x="388" y="148" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">ekspor</text><text x="518" y="236" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">digabung lewat kode</text><text x="518" y="252" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">peserta dan jam WIB</text></svg>
