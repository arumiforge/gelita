<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 796" role="img" aria-label="Enam tahap, lima gerbang: sistem baru diubah setelah instrumen lolos validasi" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="760" height="796" fill="#fff"/><defs><marker id="road-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#525252"/></marker></defs><text x="24" y="36" font-size="15" font-weight="600" fill="#0a0a0a" text-anchor="start">Enam tahap, lima gerbang: sistem baru diubah setelah instrumen lolos validasi</text><rect x="24" y="60" width="712" height="72" rx="10" fill="#efefef" stroke="#0a0a0a" stroke-width="2"/><text x="40" y="84" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">Tahap 1 · Desain instrumen</text><rect x="628" y="71" width="69.6" height="18" rx="9" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1"/><text x="662.8" y="84" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">SEKARANG</text><text x="40" y="104" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Setujui tiga dimensi; bekukan peta bukti dan definisi 10 analitik di kamus data.</text><text x="40" y="120" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Kode kesalahan, Skenario Digital, butir jangkar, tes awal–akhir, angket, lembar L0–L8, kode sekolah.</text><g fill="#fff" stroke="#525252" stroke-width="1.25"><path d="M60 132V148" fill="none"/><polygon points="60,148 72,160 60,172 48,160"/><path d="M60 172V186" fill="none" marker-end="url(#road-arrow)"/></g><text x="84" y="164" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="start">G1 · Konstruk disetujui; semua dokumen tahap 1 selesai dan disetujui pengembang</text><rect x="24" y="188" width="712" height="72" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25"/><text x="40" y="212" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">Tahap 2 · Validasi ahli dan izin etik</text><text x="40" y="232" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Validasi isi oleh ahli budaya Kedu, bahasa anak, literasi digital, pengukuran, dan media (langkah 1).</text><text x="40" y="248" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Uji keterbacaan dengan beberapa anak di luar sampel; ajukan izin etik dan surat izin orang tua.</text><g fill="#fff" stroke="#525252" stroke-width="1.25"><path d="M60 260V276" fill="none"/><polygon points="60,276 72,288 60,300 48,288"/><path d="M60 300V314" fill="none" marker-end="url(#road-arrow)"/></g><text x="84" y="292" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="start">G2 · Dua ahli sepakat pada label (κ ≥ 0,70), instrumen direvisi, persetujuan etik terbit</text><rect x="24" y="316" width="712" height="72" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25"/><text x="40" y="340" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">Tahap 3 · Dokumen implementasi dan perubahan sistem</text><text x="40" y="360" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Susun dokumen implementasi lengkap, lalu kerjakan semua perubahan dari Catatan perubahan sistem.</text><text x="40" y="376" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Satu cabang pendek per perubahan; uji di perangkat sekolah sasaran.</text><g fill="#fff" stroke="#525252" stroke-width="1.25"><path d="M60 388V404" fill="none"/><polygon points="60,404 72,416 60,428 48,416"/><path d="M60 428V442" fill="none" marker-end="url(#road-arrow)"/></g><text x="84" y="420" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="start">G3 · Semua tes lulus, game berjalan di perangkat sekolah, ahli media menilai layar baru</text><rect x="24" y="444" width="712" height="72" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25"/><text x="40" y="468" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">Tahap 4 · Uji coba satu kelas</text><text x="40" y="488" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Berpikir lantang 5–8 siswa; uji semua lembar; latih pengamat L4 sampai κ ≥ 0,60.</text><text x="40" y="504" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Tetapkan ambang waktu tidak aktif dan tebakan cepat; revisi skema kesalahan bila perlu.</text><g fill="#fff" stroke="#525252" stroke-width="1.25"><path d="M60 516V532" fill="none"/><polygon points="60,532 72,544 60,556 48,544"/><path d="M60 556V570" fill="none" marker-end="url(#road-arrow)"/></g><text x="84" y="548" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="start">G4 · Skema kesalahan dan rencana analisis dibekukan</text><rect x="24" y="572" width="712" height="72" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25"/><text x="40" y="596" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">Tahap 5 · Pengambilan data utama</text><text x="40" y="616" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Tes awal, sesi bermain dengan lembar L1–L5, lalu tes akhir; rekap lembar paling lambat 24 jam.</text><text x="40" y="632" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Diskusi harian tentang penyimpangan protokol.</text><g fill="#fff" stroke="#525252" stroke-width="1.25"><path d="M60 644V660" fill="none"/><polygon points="60,660 72,672 60,684 48,672"/><path d="M60 684V698" fill="none" marker-end="url(#road-arrow)"/></g><text x="84" y="676" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="start">G5 · Data lengkap dan bersih; persetujuan L7 sudah dicocokkan</text><rect x="24" y="700" width="712" height="72" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="1.25"/><text x="40" y="724" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="start">Tahap 6 · Analisis dan pelaporan</text><text x="40" y="744" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Rasch per dimensi, pola kesalahan, waktu aktif, skenario digital, validitas; dengan dan tanpa percobaan dibantu.</text><text x="40" y="760" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">Naskah jurnal dan laporan penelitian.</text></svg>
