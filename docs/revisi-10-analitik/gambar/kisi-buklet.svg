<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="Empat buklet variasi: tetangga sebangku selalu mendapat variasi berbeda, dan semua buklet tersambung lewat variasi yang sama" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="760" height="520" fill="#fff"/><text x="24" y="36" font-size="15" font-weight="600" fill="#0a0a0a">Empat buklet: tetangga sebangku selalu beda variasi, semua buklet tetap tersambung</text><text x="24" y="76" font-size="13" font-weight="600" fill="#525252">Variasi per wilayah</text><text x="24" y="94" font-size="11" fill="#525252">berlaku untuk tantangan 2, 3, 4 (babak 2), dan 5</text><g font-size="12" fill="#0a0a0a"><text x="104" y="124" font-weight="600" text-anchor="middle">TMG</text><text x="164" y="124" font-weight="600" text-anchor="middle">MGL</text><text x="224" y="124" font-weight="600" text-anchor="middle">WNB</text><text x="276" y="124" font-weight="600" fill="#525252">duduk di</text></g><g font-size="12"><text x="40" y="160" font-weight="600" fill="#0a0a0a">B1</text><rect x="90" y="144" width="28" height="22" rx="11" fill="#efefef" stroke="#0a0a0a"/><text x="104" y="160" text-anchor="middle">a</text><rect x="150" y="144" width="28" height="22" rx="11" fill="#efefef" stroke="#0a0a0a"/><text x="164" y="160" text-anchor="middle">a</text><rect x="210" y="144" width="28" height="22" rx="11" fill="#efefef" stroke="#0a0a0a"/><text x="224" y="160" text-anchor="middle">a</text><text x="276" y="160" fill="#525252">baris 1</text><text x="40" y="196" font-weight="600" fill="#0a0a0a">B2</text><rect x="90" y="180" width="28" height="22" rx="11" fill="#0a0a0a"/><text x="104" y="196" text-anchor="middle" fill="#fff">b</text><rect x="150" y="180" width="28" height="22" rx="11" fill="#0a0a0a"/><text x="164" y="196" text-anchor="middle" fill="#fff">b</text><rect x="210" y="180" width="28" height="22" rx="11" fill="#0a0a0a"/><text x="224" y="196" text-anchor="middle" fill="#fff">b</text><text x="276" y="196" fill="#525252">baris 1</text><text x="40" y="232" font-weight="600" fill="#0a0a0a">B3</text><rect x="90" y="216" width="28" height="22" rx="11" fill="#efefef" stroke="#0a0a0a"/><text x="104" y="232" text-anchor="middle">a</text><rect x="150" y="216" width="28" height="22" rx="11" fill="#0a0a0a"/><text x="164" y="232" text-anchor="middle" fill="#fff">b</text><rect x="210" y="216" width="28" height="22" rx="11" fill="#efefef" stroke="#0a0a0a"/><text x="224" y="232" text-anchor="middle">a</text><text x="276" y="232" fill="#525252">baris 2</text><text x="40" y="268" font-weight="600" fill="#0a0a0a">B4</text><rect x="90" y="252" width="28" height="22" rx="11" fill="#0a0a0a"/><text x="104" y="268" text-anchor="middle" fill="#fff">b</text><rect x="150" y="252" width="28" height="22" rx="11" fill="#efefef" stroke="#0a0a0a"/><text x="164" y="268" text-anchor="middle">a</text><rect x="210" y="252" width="28" height="22" rx="11" fill="#0a0a0a"/><text x="224" y="268" text-anchor="middle" fill="#fff">b</text><text x="276" y="268" fill="#525252">baris 2</text></g><text x="24" y="310" font-size="12" fill="#0a0a0a">Setiap variasi ada di 2 dari 4 buklet:</text><text x="24" y="328" font-size="12" fill="#0a0a0a">dikerjakan setengah sampel.</text><text x="24" y="354" font-size="12" fill="#0a0a0a">B1 dan B3 sama-sama memakai TMG-a dan WNB-a;</text><text x="24" y="372" font-size="12" fill="#0a0a0a">B1 dan B4 sama-sama memakai MGL-a, dan seterusnya.</text><text x="24" y="390" font-size="12" fill="#0a0a0a">Karena itu semua butir tersambung di satu skala.</text><rect x="400" y="62" width="336" height="26" rx="6" fill="#525252"/><text x="568" y="80" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Papan tulis (token sesi)</text><text x="400" y="118" font-size="11" fill="#525252">Baris 1</text><g font-size="12" font-weight="600" text-anchor="middle"><rect x="400" y="126" width="72" height="40" rx="8" fill="#efefef" stroke="#0a0a0a"/><text x="436" y="151">B1</text><rect x="488" y="126" width="72" height="40" rx="8" fill="#0a0a0a"/><text x="524" y="151" fill="#fff">B2</text><rect x="576" y="126" width="72" height="40" rx="8" fill="#efefef" stroke="#0a0a0a"/><text x="612" y="151">B1</text><rect x="664" y="126" width="72" height="40" rx="8" fill="#0a0a0a"/><text x="700" y="151" fill="#fff">B2</text></g><text x="400" y="194" font-size="11" fill="#525252">Baris 2</text><g font-size="12" font-weight="600" text-anchor="middle"><rect x="400" y="202" width="72" height="40" rx="8" fill="#fff" stroke="#0a0a0a" stroke-dasharray="4 3"/><text x="436" y="227">B3</text><rect x="488" y="202" width="72" height="40" rx="8" fill="#525252"/><text x="524" y="227" fill="#fff">B4</text><rect x="576" y="202" width="72" height="40" rx="8" fill="#fff" stroke="#0a0a0a" stroke-dasharray="4 3"/><text x="612" y="227">B3</text><rect x="664" y="202" width="72" height="40" rx="8" fill="#525252"/><text x="700" y="227" fill="#fff">B4</text></g><text x="400" y="270" font-size="11" fill="#525252">Baris 3</text><g font-size="12" font-weight="600" text-anchor="middle"><rect x="400" y="278" width="72" height="40" rx="8" fill="#efefef" stroke="#0a0a0a"/><text x="436" y="303">B1</text><rect x="488" y="278" width="72" height="40" rx="8" fill="#0a0a0a"/><text x="524" y="303" fill="#fff">B2</text><rect x="576" y="278" width="72" height="40" rx="8" fill="#efefef" stroke="#0a0a0a"/><text x="612" y="303">B1</text><rect x="664" y="278" width="72" height="40" rx="8" fill="#0a0a0a"/><text x="700" y="303" fill="#fff">B2</text></g><text x="400" y="346" font-size="12" fill="#0a0a0a">Kiri–kanan: B1/B2 dan B3/B4 berbeda di semua wilayah.</text><text x="400" y="364" font-size="12" fill="#0a0a0a">Depan–belakang: B1/B3 dan B2/B4 berbeda di Magelang.</text><text x="400" y="382" font-size="12" fill="#0a0a0a">Buklet dibagikan P1 menurut denah L2.</text><line x1="24" y1="420" x2="736" y2="420" stroke="#d4d4d4"/><text x="24" y="448" font-size="12" fill="#525252">Butir jangkar (kode x) dan babak 1 Cari Objek sama di keempat buklet, jadi dikerjakan seluruh sampel.</text><text x="24" y="470" font-size="12" fill="#525252">Pengerjaan ulang tidak mengikuti buklet: variasinya bebas, karena tidak masuk skor utama.</text><text x="24" y="492" font-size="12" fill="#525252">Usulan, menunggu keputusan pengembang (lihat 06_KISI_KISI_BANK_SOAL.md, bagian Desain buklet).</text></svg>
