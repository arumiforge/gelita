<body class="game" data-hud="logo-centre" data-back="Kembali" data-code="mk-cr-02">
<div class="stage-frame"><div class="stage" id="stage">

  <main id="app" class="stage-main">
  <section class="mission">
    <article class="panel-parchment mission-card stage-box">
      <svg class="mission-defs" aria-hidden="true"><defs>
        <symbol id="mission-corner" viewBox="0 0 48 48"><path d="M3 45V14C3 8 8 3 14 3h31M9 45V19c0-6 4-10 10-10h26M14 22c0-5 3-8 8-8M3 30c5 0 8 3 8 8"/><circle cx="22" cy="22" r="2.5"/></symbol>

      <svg class="mission-corner is-tl"><use href="#mission-corner"/></svg><svg class="mission-corner is-tr"><use href="#mission-corner"/></svg>

      </div>
      <div class="mission-actions"><svg class="mission-wing is-left"><use href="#mission-flourish"/></svg><a class="btn btn-primary btn-xl" href="#"><span>Mulai tantangan</span></a><svg class="mission-wing is-right"><use href="#mission-flourish"/></svg></div>

  </main>
