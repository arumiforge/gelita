# deploy/windows/nginx/gelita.id.conf -> C:\laragon\etc\nginx\sites-enabled\gelita.id.conf
# The one Nginx site file of the GELITA server (gelita.id), copied as it is.
# The server is a Windows machine with Laragon behind a Cloudflare Tunnel:
# Cloudflare ends HTTPS, and cloudflared, on this machine, passes each request
# to port 80 without TLS. No certificate on this machine; the Windows firewall
# keeps port 80 closed to the network.
# It listens like every other Laragon site ("listen 80"), and server_name picks
# the site. Never "listen 127.0.0.1:80": Nginx then gives every request on that
# address to this file, and cloudflared sends all the server's sites there, so
# every site on the server showed GELITA (21 November 2026).
# The file name must NOT start with "auto." (Laragon rewrites those files).
# Paths use "/".
# In the tunnel's settings the service is http://127.0.0.1:80, not "localhost"
# (Windows tries ::1 first and waits before it falls back, as with the database host).
#
# Without the Cache-Control header set here, Cloudflare gives the asset package
# files its own short default instead of "immutable" and students download
# them again. tests/unit/DeployFilesTest.php keeps the rules of this file.

# Asset caching. Only URLs with ?v= may be immutable: CSS, JS entries, and
# vendor files (asset_url_versioned()), plus media from media_assets, whose ?v=
# comes from the file's sha256 (MediaStore::versionedPath()), so a replaced
# upload always gets a new URL. Imported JS modules, fonts, and other files have
# no ?v=, so the browser must revalidate (304 when the file is unchanged).
# Asset package files (docs/rencana-paket-aset.md §5.2) never change once
# written: media in /assets/p/ are named by their sha256, code in /assets/k/
# sits in a per-version folder, and /paket/pkt-*.json manifests are written
# once per package. They are immutable without ?v= (value 2).
map $uri $gelita_is_asset {
    default 0;
    ~^/(?:assets/[pk]/|paket/pkt-[^/]+\.json$) 2;
    ~*\.(?:css|js|json|jpe?g|png|gif|webp|svg|ico|woff2?|ttf|mp3|ogg|wav|m4a|mp4|webm)$ 1;
}
map "$gelita_is_asset:$arg_v" $gelita_cache {
    default "";
    "1:"    "no-cache";
    ~^1:.   "public, max-age=31536000, immutable";
    ~^2:    "public, max-age=31536000, immutable";
}

server {
    listen 80;                                  # like every Laragon site; server_name picks the site
    server_name gelita.id;

    # The visitor's address, from the header cloudflared passes on. Trusted
    # only from this machine, where cloudflared runs.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    root "C:/laragon/www/gelita/public";
    index index.php;
    charset utf-8;
    server_tokens off;

    client_max_body_size 72M;

    # Satu-satunya tempat add_header. add_header di dalam location menghapus
    # SEMUA header warisan server, jadi jangan menambahkannya di location mana pun.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $gelita_cache;          # nilai kosong = tidak dikirim

    # Mode pemeliharaan: selama berkas penanda ada, semua permintaan dijawab 503.
    if (-f "C:/laragon/www/gelita/writable/pemeliharaan.flag") {
        return 503;
    }
    error_page 503 @pemeliharaan;
    location @pemeliharaan {
        default_type "text/html; charset=utf-8";
        return 503 '<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GELITA</title><body style="font-family:sans-serif;text-align:center;padding:3rem">GELITA sedang diperbarui. Coba lagi beberapa menit lagi.<br><i>GELITA is being updated. Please try again in a few minutes.</i></body></html>';
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Hanya front controller yang dieksekusi PHP
    location = /index.php {
        # Nginx's own fastcgi.conf (conf\ of every Nginx build), not Laragon's
        # snippets/fastcgi-php.conf: that snippet sets fastcgi_read_timeout
        # itself, and a second one here stops Nginx from starting ("directive
        # is duplicate", Laragon Nginx 1.30.4, 21 November 2026).
        include fastcgi.conf;
        fastcgi_pass php_upstream;              # didefinisikan Laragon (etc/nginx/php_upstream.conf)
        fastcgi_read_timeout 300;               # data downloads run up to 300 s (max_execution_time)
        fastcgi_param HTTPS on;                 # the visitor is on HTTPS (secure cookies, https:// links)
        # Filter secureheaders CodeIgniter mengirim header yang sama; buang
        # salinan dari PHP agar setiap header hanya muncul sekali.
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
    }
    location ~ \.php$ {
        return 404;
    }

    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
        location ~ /\. { return 404; }
    }

    # Berkas tersembunyi (.htaccess, .gitkeep, .env, .git) tidak pernah dilayani
    location ~ /\. {
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
