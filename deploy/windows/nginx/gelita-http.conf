# deploy/windows/nginx/gelita-http.conf -> C:\laragon\etc\nginx\sites-enabled\gelita-http.conf
# Nama berkas TIDAK boleh berawalan "auto." (Laragon menulis ulang berkas itu).
# Ganti gelita.sekolah.sch.id dengan domain server; path ditulis dengan "/".
#
# port 80: validasi Let's Encrypt (simple-acme) + alihkan ke HTTPS
server {
    listen 80;
    server_name gelita.sekolah.sch.id;

    location ^~ /.well-known/acme-challenge/ {
        root "C:/laragon/www/gelita/public";
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
