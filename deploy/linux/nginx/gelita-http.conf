# deploy/linux/nginx/gelita-http.conf → /etc/nginx/sites-available/gelita-http
# Domain: gelita.id, the one GELITA server (owner, 21 November 2026).
#
# port 80: validasi Let's Encrypt + alihkan ke HTTPS
server {
    listen 80;
    server_name gelita.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gelita/public;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
