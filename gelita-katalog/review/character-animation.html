<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GELITA · Review 24 frame karakter</title><style>body{font:16px system-ui;background:#eee9df;color:#24312a;margin:30px}main{max-width:850px;margin:auto}img{display:block;height:min(65vh,650px);max-width:100%;margin:20px auto;background:repeating-conic-gradient(#ddd 0% 25%,#eee 0% 50%) 0/24px 24px}select,button,input{font:inherit;margin:8px;padding:8px}small{display:block}a{color:inherit}</style><main><h1>24 frame per pose</h1><p>10 key pose AI dengan gerak sekunder deterministik. Ekspresi tetap mengikuti gambar dasar. Preview ini tidak membuktikan integrasi game atau animasi rig sendi.</p><select id="pose"><option>char.jaka.idle</option><option>char.jaka.happy</option><option>char.jaka.sad</option><option>char.jaka.afraid</option><option>char.jaka.determined</option><option>char.jaka.bow</option><option>char.kedu.idle</option><option>char.kedu.smile</option><option>char.kedu.worried</option><option>char.kedu.weak</option></select><button id="play">Putar</button><label>FPS <input id="fps" type="number" min="1" max="24" value="12" style="width:55px"></label><input id="frame" type="range" min="1" max="24" value="1"><small id="label"></small><img id="image" alt="Frame karakter"><a id="original">Buka WebP</a><p><a href="../index.html">Katalog</a></p></main><script>const $=s=>document.querySelector(s);let n=1,timer;function show(){const file='../assets/karakter/'+$('#pose').value+'.'+n+'.webp';$('#image').src=file;$('#original').href=file;$('#label').textContent=$('#pose').value+' · frame '+n+'/24';$('#frame').value=n}function stop(){clearInterval(timer);timer=null;$('#play').textContent='Putar'}$('#pose').onchange=()=>{stop();n=1;show()};$('#frame').oninput=()=>{stop();n=Number($('#frame').value);show()};$('#play').onclick=()=>{if(timer)stop();else{timer=setInterval(()=>{n=n%24+1;show()},1000/Math.max(1,Number($('#fps').value)));$('#play').textContent='Jeda'}};show();</script></html>
