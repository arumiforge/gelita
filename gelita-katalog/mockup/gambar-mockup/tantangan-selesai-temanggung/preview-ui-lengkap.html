<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GELITA — Preview UI lengkap, kanvas tetap 16:9</title>
<style>
:root{color-scheme:dark;--gold:#DFC087;--cream:#F8EACB;--muted:#BCC8DC;--green:#92E46B}
*{box-sizing:border-box}body{margin:0;background:#030710;color:var(--cream);font-family:'Trebuchet MS',sans-serif;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible{outline:6px solid #B7EDFF;outline-offset:5px}button:hover{filter:brightness(1.12)}button:active{filter:brightness(.95)}[hidden]{display:none!important}
#viewport{position:fixed;inset:0;overflow:hidden}#game{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:#14253D url('aset-baru/bg-tantangan-selesai-temanggung-3d.webp') center/cover no-repeat;isolation:isolate}
#game:before{content:'';position:absolute;inset:0;background:linear-gradient(#07132230,transparent 20%,transparent 85%,#040A1670);z-index:-1}
.hud{position:absolute;left:48px;right:48px;top:18px;height:160px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:34px}.logo{width:310px;height:116px;object-fit:contain}.region{border-left:2px solid var(--gold);padding-left:30px;font-family:'Palatino Linotype',Georgia,serif;font-size:46px;font-weight:700}.controls{display:flex;gap:20px}.hud-button{position:relative;width:144px;height:144px;background:transparent;display:grid;place-items:center;padding:0}.hud-button:before{content:'';position:absolute;width:104px;height:104px;background:url('aset-ui/tombol-hud.svg') center/100% 100%;z-index:-1}.hud-button img{width:58px;height:58px;object-fit:contain}.hud-button.language:before{display:none}.hud-button.language img{width:104px;height:104px}
.panel{position:absolute;left:180px;top:218px;width:1560px;height:784px;background:url('aset-ui/panel-hasil.svg') center/100% 100%;filter:drop-shadow(0 16px 24px #02071088)}.heading{text-align:center;padding-top:28px}.context{font-size:28px;font-weight:700;letter-spacing:2px;margin:0;color:#EACB87}.heading h1{font-size:82px;line-height:1.08;letter-spacing:-2px;margin:8px 0 0;color:#FFEBB6;text-shadow:0 3px 0 #77532F,0 0 20px #E5AD4460}.stars{display:flex;justify-content:center;gap:30px;margin-top:8px}.star{width:78px;height:78px;filter:drop-shadow(0 0 10px #D6A54080)}.star.empty{filter:none}
.result-body{position:absolute;left:64px;right:64px;top:250px;display:grid;grid-template-columns:700px 692px;gap:36px}.collection{display:flex;align-items:center;gap:24px;height:302px;border-right:1px solid #DFC08777;padding-right:20px}.medallion{width:310px;height:310px;object-fit:contain;filter:drop-shadow(0 0 16px #EABD5655)}.collection-text{flex:1}.collection-text h2{font-size:38px;line-height:1.15;margin:0 0 16px}.collection-count{font-size:66px;font-weight:700;line-height:1;margin:0 0 20px}.progress{height:54px;padding:10px;display:grid;grid-template-columns:repeat(12,1fr);gap:7px;border:1px solid #B89A6266;border-radius:16px;background:#061224}.progress span{background:linear-gradient(#4C6588,#253B58);border-radius:7px}.progress span.on{background:linear-gradient(#FFF1C9,#E8BA60);box-shadow:0 0 16px #EDB84A}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stat{height:160px;padding:22px 20px;background:url('aset-ui/kartu-statistik.svg') center/100% 100%}.stat-label{display:flex;gap:12px;align-items:center;font-size:38px;color:var(--muted)}.stat-label img{width:48px;height:48px}.stat-value{font-size:66px;font-weight:700;line-height:1.1;margin:6px 0 0 64px}.right-result{text-align:center}.correct{display:inline-flex;align-items:center;gap:14px;border:2px solid var(--green);border-radius:36px;background:#0D37269C;padding:8px 28px;margin:16px 0 6px;color:var(--green);font-size:38px;font-weight:700;min-height:62px}.correct .check{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--green);color:#102F23;font-size:32px}.encouragement{font-size:36px;line-height:1.18;margin:0;color:#D8E1F1}
.footer{position:absolute;bottom:34px;left:60px;right:60px;padding-top:22px;border-top:1px solid #DBC08466;display:grid;grid-template-columns:460px 320px 1fr;gap:26px}.action{height:132px;background:url('aset-ui/tombol-sekunder.svg') center/100% 100%;font-size:38px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:18px;padding:0 24px}.action img{width:44px;height:44px}.action.primary{background-image:url('aset-ui/tombol-primer.svg');color:#121A27;font-size:48px;text-shadow:0 1px #FFF3CF}.primary .arrow{font-size:60px;font-weight:400}.action.detail{border:1px solid #BA976F88;background:linear-gradient(#15263A,#081421);border-radius:26px;font-size:32px}
.scrim{position:absolute;inset:0;background:#020714AA;z-index:4}.overlay{position:absolute;z-index:5;filter:drop-shadow(0 18px 24px #000A)}.language-popover{top:174px;right:320px;width:720px;height:360px;background:url('aset-ui/panel-bahasa.svg') center/100% 100%;padding:26px 30px}.language-choice{width:100%;height:144px;display:flex;align-items:center;gap:22px;background:transparent;padding:14px 18px;text-align:left;font-size:40px;border-radius:16px}.language-choice+button{border-top:1px solid #DFC08755}.language-choice img{width:82px;height:82px}.choice-check{color:var(--green);margin-left:auto;font-size:44px}.menu-sheet{right:46px;top:190px;width:650px;height:828px;background:url('aset-ui/panel-menu.svg') center/100% 100%;padding:22px 28px}.sheet-header{height:116px;display:flex;align-items:center;justify-content:space-between;padding-left:14px}.sheet-header h2{font-size:48px;margin:0}.close{width:144px;height:144px;display:grid;place-items:center;background:transparent;font-size:70px;font-weight:400}.menu-row{height:144px;width:100%;display:flex;align-items:center;gap:22px;padding:16px 22px;background:#09182B99;border:1px solid #A1AABC38;font-size:36px;text-align:left;border-radius:16px}.menu-row img{width:52px;height:52px}.menu-row .chevron{margin-left:auto;font-size:46px}.profile{margin-bottom:12px}.avatar{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#F5DEAB,#C79B4D);color:#102035;font-size:52px;font-weight:700}.profile-name{font-size:40px;font-weight:700}.profile-handle{display:block;font-size:28px;color:var(--muted);font-weight:400;margin-top:4px}.menu-row.logout{margin-top:22px}.detail-sheet{left:540px;top:318px;width:840px;min-height:444px;background:url('aset-ui/panel-detail.svg') center/100% 100%;padding:28px 42px}.detail-sheet .sheet-header{padding:0;height:114px}.detail-line{font-size:40px;margin-top:24px;color:var(--muted);line-height:1.3}.detail-line strong{display:block;color:var(--cream);font-size:56px;margin-top:12px}.toast{position:absolute;z-index:10;bottom:28px;left:400px;width:1120px;text-align:center;padding:20px;background:#071423F0;border:1px solid var(--gold);border-radius:18px;font-size:34px}
.stat-value{white-space:nowrap;margin-left:0;text-align:center}
@media(prefers-reduced-motion:no-preference){.overlay{animation:appear .16s ease-out}@keyframes appear{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}}
</style>
<link rel="stylesheet" href="reference-layout.css">
</head>
<body>
<div id="viewport"><main id="game" aria-label="Preview UI GELITA, kanvas tetap 16:9">
  <header class="hud" id="hud">
    <div class="brand"><img class="logo" src="aset-katalog/logo-gelita.webp" alt="GELITA"><span class="region">Temanggung</span></div>
    <nav class="controls" aria-label="Kontrol permainan">
      <button class="hud-button language" id="language-trigger" aria-label="Bahasa" aria-expanded="false" aria-controls="language-popover"><img id="current-language-icon" src="aset-katalog/bahasa-indonesia-flag.webp" alt="Bendera Indonesia"></button>
      <button class="hud-button" id="sound-trigger" aria-label="Matikan suara" aria-pressed="false"><img id="sound-icon" src="aset-katalog/ikon-speaker.svg" alt=""></button>
      <button class="hud-button" id="menu-trigger" aria-label="Menu" aria-expanded="false" aria-controls="menu-sheet"><img src="aset-katalog/ikon-menu.svg" alt=""></button>
    </nav>
  </header>
  <section class="panel" id="result-panel" aria-labelledby="result-title">
    <div class="heading"><p class="context" data-i18n="context">SUSUN GAMBAR</p><h1 id="result-title" data-i18n="title">Tantangan selesai!</h1>
      <div class="stars" id="stars" role="img" aria-label="2 dari 3 bintang">
        <img class="star" src="aset-ui/bintang-hasil.webp" alt="">
        <img class="star" src="aset-ui/bintang-hasil.webp" alt="">
        <svg class="star empty" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.1 6.3 7 .9-5.1 5 1.2 7-6.2-3.3L5.8 21l1.2-7L2 9.2l6.9-.9Z" fill="none" stroke="#8493B9" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="result-body">
      <div class="collection"><img class="medallion" src="aset-katalog/medali-serpihan-cahaya.webp" alt="Medali serpihan cahaya"><div class="collection-text"><h2 data-i18n="shards">Serpihan cahaya</h2><p class="collection-count">1 / 12</p><div class="progress" id="progress" role="img" aria-label="1 dari 12 serpihan"><span class="on"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div>
      <div class="right-result"><div class="stats"><div class="stat"><div class="stat-label"><img src="aset-katalog/ikon-waktu.svg" alt=""><span data-i18n="time">Waktu</span></div><p class="stat-value">2:05</p></div><div class="stat"><div class="stat-label"><img src="aset-katalog/ikon-percobaan.svg" alt=""><span data-i18n="attempts">Percobaan</span></div><p class="stat-value" data-i18n="attemptValue">2 dari 3</p></div></div>
        <div class="correct"><span class="check" aria-hidden="true">✓</span><span data-i18n="correct">Semua benar</span></div><p class="encouragement"><span data-i18n="encourage1">Kamu mencoba 2 kali.</span> <span data-i18n="encourage2">Terus berusaha itu hebat!</span></p>
      </div>
    </div>
    <div class="footer"><button class="action" id="region-trigger"><img src="aset-katalog/ikon-panah-kembali.svg" alt=""><span data-i18n="regionMap">Peta Temanggung</span></button><button class="action detail" id="detail-trigger" aria-expanded="false" aria-controls="detail-sheet"><span data-i18n="details">Detail hasil</span><img src="aset-katalog/ikon-chevron-bawah.svg" alt=""></button><button class="action primary" id="next-trigger"><span data-i18n="next">Berikutnya</span><span class="arrow" aria-hidden="true">›</span></button></div>
  </section>
  <div class="scrim" id="scrim" hidden></div>
  <div class="overlay language-popover" id="language-popover" role="menu" aria-label="Pilihan bahasa" hidden>
    <button class="language-choice" data-language="id" role="menuitemradio" aria-checked="true"><img src="aset-katalog/bahasa-indonesia-flag.webp" alt="Bendera Indonesia"><span>Bahasa Indonesia</span><span class="choice-check" aria-hidden="true">✓</span></button>
    <button class="language-choice" data-language="en" role="menuitemradio" aria-checked="false"><img src="aset-katalog/bahasa-english-uk-flag.webp" alt="Bendera UK"><span>English</span><span class="choice-check" aria-hidden="true" hidden>✓</span></button>
  </div>
  <section class="overlay menu-sheet" id="menu-sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden>
    <div class="sheet-header"><h2 id="menu-title" data-i18n="menu">Menu</h2><button class="close" data-close aria-label="Tutup menu">×</button></div>
    <button class="menu-row profile" data-demo="profile"><span class="avatar">D</span><span class="profile-name">Dino<span class="profile-handle">@dino</span></span><span class="chevron" aria-hidden="true">›</span></button>
    <button class="menu-row" data-demo="home"><img src="aset-katalog/ikon-home.svg" alt=""><span data-i18n="home">Beranda / Peta Kedu</span><span class="chevron" aria-hidden="true">›</span></button>
    <button class="menu-row" id="fullscreen-trigger"><img id="fullscreen-icon" src="aset-baru/ikon-layar-penuh.svg" alt=""><span data-i18n="fullscreen">Layar penuh</span><span class="chevron" aria-hidden="true">›</span></button>
    <button class="menu-row logout" data-demo="logout"><img src="aset-katalog/ikon-keluar.svg" alt=""><span data-i18n="logout">Keluar</span><span class="chevron" aria-hidden="true">›</span></button>
  </section>
  <section class="overlay detail-sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden><div class="sheet-header"><h2 id="detail-title" data-i18n="details">Detail hasil</h2><button class="close" data-close aria-label="Tutup detail">×</button></div><p class="detail-line"><span data-i18n="firstAttempt">Berhasil pada percobaan pertama</span><strong data-i18n="notYet">Belum</strong></p></section>
  <div class="toast" id="toast" role="status" hidden></div>
</main></div>
<script>
(() => {
  const game=document.getElementById('game'), hud=document.getElementById('hud'), panel=document.getElementById('result-panel'), scrim=document.getElementById('scrim');
  const overlays={language:document.getElementById('language-popover'),menu:document.getElementById('menu-sheet'),detail:document.getElementById('detail-sheet')};
  const triggers={language:document.getElementById('language-trigger'),menu:document.getElementById('menu-trigger'),detail:document.getElementById('detail-trigger')};
  const text={id:{context:'SUSUN GAMBAR',title:'Tantangan selesai!',shards:'Serpihan cahaya',time:'Waktu',attempts:'Percobaan',attemptValue:'2 dari 3',correct:'Semua benar',encourage1:'Kamu mencoba 2 kali.',encourage2:'Terus berusaha itu hebat!',regionMap:'Peta Temanggung',details:'Detail hasil',next:'Berikutnya',menu:'Menu',home:'Beranda / Peta Kedu',fullscreen:'Layar penuh',logout:'Keluar',firstAttempt:'Berhasil pada percobaan pertama',notYet:'Belum'},en:{context:'PICTURE PUZZLE',title:'Challenge complete!',shards:'Light shards',time:'Time',attempts:'Attempts',attemptValue:'2 of 3',correct:'All correct',encourage1:'You tried twice.',encourage2:'Great effort. Keep going!',regionMap:'Temanggung map',details:'Result details',next:'Next',menu:'Menu',home:'Home / Kedu map',fullscreen:'Fullscreen',logout:'Sign out',firstAttempt:'Completed on the first attempt',notYet:'Not yet'}};
  let active=null, language='id', muted=false, toastTimer;
  function scale(){const s=Math.min(innerWidth/1920,innerHeight/1080);game.style.transform=`scale(${s})`;game.style.left=`${(innerWidth-1920*s)/2}px`;game.style.top=`${(innerHeight-1080*s)/2}px`;game.dataset.scale=String(s)}
  function close(){const old=active;active=null;Object.values(overlays).forEach(el=>el.hidden=true);Object.values(triggers).forEach(el=>el.setAttribute('aria-expanded','false'));scrim.hidden=true;hud.inert=false;panel.inert=false;if(old)triggers[old].focus()}
  function open(name){if(active===name){close();return}close();active=name;overlays[name].hidden=false;triggers[name].setAttribute('aria-expanded','true');const modal=name!=='language';scrim.hidden=!modal;hud.inert=modal;panel.inert=modal;overlays[name].querySelector('button').focus()}
  function announce(value){const el=document.getElementById('toast');el.textContent=value;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2200)}
  function setLanguage(value){language=value;document.documentElement.lang=value;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=text[value][el.dataset.i18n]);document.getElementById('current-language-icon').src=`aset-katalog/bahasa-${value==='id'?'indonesia-flag':'english-uk-flag'}.webp`;document.getElementById('current-language-icon').alt=value==='id'?'Bendera Indonesia':'Bendera UK';document.querySelectorAll('[data-language]').forEach(el=>{const selected=el.dataset.language===value;el.setAttribute('aria-checked',String(selected));el.querySelector('.choice-check').hidden=!selected});document.getElementById('stars').setAttribute('aria-label',value==='id'?'2 dari 3 bintang':'2 of 3 stars');document.getElementById('progress').setAttribute('aria-label',value==='id'?'1 dari 12 serpihan':'1 of 12 shards');triggers.language.setAttribute('aria-label',value==='id'?'Bahasa':'Language');triggers.menu.setAttribute('aria-label',text[value].menu);document.querySelectorAll('[data-close]').forEach(el=>el.setAttribute('aria-label',value==='id'?'Tutup':'Close'));updateSound();updateFullscreen()}
  function updateSound(){document.getElementById('sound-icon').src=`aset-katalog/ikon-speaker${muted?'-nonaktif':''}.svg`;document.getElementById('sound-trigger').setAttribute('aria-pressed',String(muted));document.getElementById('sound-trigger').setAttribute('aria-label',language==='id'?(muted?'Aktifkan suara':'Matikan suara'):(muted?'Unmute':'Mute'))}
  function updateFullscreen(){const full=!!document.fullscreenElement;document.getElementById('fullscreen-icon').src=`aset-baru/ikon-${full?'keluar-layar-penuh':'layar-penuh'}.svg`;document.querySelector('#fullscreen-trigger span[data-i18n]').textContent=full?(language==='id'?'Keluar layar penuh':'Exit fullscreen'):text[language].fullscreen}
  Object.entries(triggers).forEach(([name,el])=>el.addEventListener('click',()=>open(name)));
  document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',close));scrim.addEventListener('click',close);
  document.querySelectorAll('[data-language]').forEach(el=>el.addEventListener('click',()=>{setLanguage(el.dataset.language);close()}));
  document.getElementById('sound-trigger').addEventListener('click',()=>{muted=!muted;updateSound()});
  document.getElementById('fullscreen-trigger').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.fullscreenEnabled)await document.documentElement.requestFullscreen();else announce(language==='id'?'Layar penuh tidak tersedia':'Fullscreen unavailable')}catch{announce(language==='id'?'Layar penuh tidak tersedia':'Fullscreen unavailable')}});
  document.addEventListener('fullscreenchange',()=>{scale();updateFullscreen()});
  document.querySelectorAll('[data-demo]').forEach(el=>el.addEventListener('click',()=>{const label={profile:'Profil Dino',home:'Peta Kedu',logout:'Keluar akun'}[el.dataset.demo];close();announce(`Preview: ${label}`)}));
  document.getElementById('region-trigger').addEventListener('click',()=>announce('Preview: Peta Temanggung'));document.getElementById('next-trigger').addEventListener('click',()=>announce(language==='id'?'Preview: tantangan berikutnya':'Preview: next challenge'));
  document.addEventListener('click',event=>{if(active==='language'&&!overlays.language.contains(event.target)&&!triggers.language.contains(event.target))close()});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&active){event.preventDefault();close()}else if(event.key==='Tab'&&active){const buttons=[...overlays[active].querySelectorAll('button')];const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
  window.addEventListener('resize',scale);scale();setLanguage('id');
  window.gelitaPreview={open,close,setLanguage,get state(){return{active,language,muted}},note:'Standalone UI reference; no game routes, auth, audio playback or reward writes.'};
})();
</script>
</body>
</html>
